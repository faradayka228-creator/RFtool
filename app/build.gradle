// =====================================================================
// build.gradle модуля приложения.
// Путь: /RFTool/app/build.gradle
// Традиционные XML-лейауты, Java/Kotlin без Compose. Совместимо с AIDE.
// =====================================================================

apply plugin: 'com.android.application'

android {
    namespace 'com.rftool.app'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.rftool.app"
        minSdkVersion 24          // NFC HCE и BLE требуют минимум API 19-21, берём с запасом
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false   // Чистые XML + findViewById, максимальная совместимость с AIDE
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.9.0'
}

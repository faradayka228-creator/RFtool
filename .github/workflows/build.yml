# Путь: /RFTool/.github/workflows/build.yml
#
# Облачная сборка APK через GitHub Actions. Срабатывает автоматически при
# каждом push в ветку main, а также вручную через вкладку Actions -> Run workflow.
# Готовый APK появляется в разделе Actions -> выбранный запуск -> Artifacts.

name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RFTool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
